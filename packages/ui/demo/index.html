<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>arg2p-ui demo</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            body {
                margin: 0;
                font-family: system-ui, sans-serif;
                display: grid;
                grid-template-columns: minmax(280px, 1fr) 2fr;
                grid-template-rows: auto 1fr 1fr;
                height: 100vh;
                gap: 8px;
                padding: 8px;
                box-sizing: border-box;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background: #1e1e1e;
                    color: #ddd;
                    --arg2p-surface: #252526;
                    --arg2p-hover: #2d3a3a;
                    --arg2p-border: #3c3c3c;
                    --arg2p-text: #dddddd;
                    --arg2p-muted: #9a9a9a;
                }
            }
            header {
                grid-column: 1 / -1;
                display: flex;
                gap: 8px;
                align-items: center;
            }
            header input {
                flex: 1;
                font-family: monospace;
            }
            textarea {
                font-family: monospace;
                width: 100%;
                height: 100%;
                box-sizing: border-box;
            }
            .left {
                grid-row: 2 / 4;
                display: grid;
                grid-template-rows: 2fr 1fr auto;
                gap: 8px;
                min-height: 0;
            }
            arg2p-graph,
            arg2p-framework {
                border: 1px solid #8884;
                min-height: 0;
            }
            arg2p-solutions {
                overflow: auto;
                max-height: 30vh;
            }
        </style>
    </head>
    <body>
        <header>
            <select id="example"></select>
            <label>?- <input id="query" value="buildLabelSets(In, Out, Und)" /></label>
            <button id="solve">Solve</button>
            <button id="stop">Stop</button>
        </header>
        <div class="left">
            <textarea id="theory" spellcheck="false"></textarea>
            <textarea id="flags" spellcheck="false">argumentLabellingMode(grounded).
statementLabellingMode(statement).</textarea>
            <arg2p-solutions hide-exhausted-no></arg2p-solutions>
        </div>
        <arg2p-graph></arg2p-graph>
        <arg2p-framework></arg2p-framework>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
