<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>arg2p-ui demo</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            body {
                margin: 0;
                font-family: system-ui, sans-serif;
                display: grid;
                grid-template-columns: minmax(300px, 1fr) minmax(260px, 0.8fr) 1.6fr;
                grid-template-rows: auto 1fr 1fr;
                height: 100vh;
                gap: 8px;
                padding: 8px;
                box-sizing: border-box;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background: #1e1e1e;
                    color: #ddd;
                    --arg2p-surface: #252526;
                    --arg2p-surface-2: #2d2d2d;
                    --arg2p-hover: #2d3a3a;
                    --arg2p-border: #3c3c3c;
                    --arg2p-text: #dddddd;
                    --arg2p-muted: #9a9a9a;
                    --arg2p-atom: #f08c7a;
                    --arg2p-functor: #c792ea;
                    --arg2p-comment: #8b9096;
                    --arg2p-accent: #4fb3b3;
                }
            }
            header {
                grid-column: 1 / -1;
                display: flex;
                gap: 8px;
                align-items: center;
            }
            header arg2p-editor {
                flex: 1;
            }
            #theory {
                grid-row: 2 / 4;
            }
            .middle {
                grid-row: 2 / 4;
                display: grid;
                grid-template-rows: 1fr auto;
                gap: 8px;
                min-height: 0;
            }
            arg2p-flags {
                overflow: auto;
                min-height: 0;
            }
            arg2p-graph,
            arg2p-framework {
                border: 1px solid #8884;
                min-height: 0;
            }
            arg2p-solutions {
                overflow: auto;
                max-height: 35vh;
            }
        </style>
    </head>
    <body>
        <header>
            <select id="example"></select>
            <span>?-</span>
            <arg2p-editor id="query" kind="query" label="Query" placeholder="The query, buildLabelSets(In, Out, Und) say"></arg2p-editor>
            <button id="solve">Solve</button>
            <button id="stop">Stop</button>
        </header>
        <arg2p-editor id="theory" kind="theory" label="Theory" placeholder="The theory"></arg2p-editor>
        <div class="middle">
            <arg2p-flags></arg2p-flags>
            <arg2p-solutions hide-exhausted-no></arg2p-solutions>
        </div>
        <arg2p-graph></arg2p-graph>
        <arg2p-framework></arg2p-framework>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
