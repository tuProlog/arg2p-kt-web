name: Run Tests

on:
  push:
  # the pull requests of forks, which no push of this repository tests
  pull_request:

permissions:
  contents: read

# A newer push to a branch, or to a pull request, cancels the run going on for it; the runs of master go to the end, as
# they deploy
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    # a pull request from a branch of this repository is tested by the push of its branch
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # the playground type-checked and tested (its components, @tuprolog/arg2p-ui, come from npm: they are released
      # with Arg2P, from tuProlog/arg2p-kt)
      - name: Run tests
        run: npm test
      - name: Build the playground
        run: npm run build -w @tuprolog/arg2p-playground
      - name: Keep the playground, to deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playground
          path: packages/playground/dist
          # .nojekyll among them: Pages publishes the files as built, without Jekyll
          include-hidden-files: true
          retention-days: 1
  # The playground on GitHub Pages (the branch gh-pages), from master, one deploy at a time
  deploy:
    runs-on: ubuntu-latest
    needs:
      - test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Get the playground built
        uses: actions/download-artifact@v8.0.2
        with:
          name: playground
          path: packages/playground/dist
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: packages/playground/dist
  success:
    # named apart in the runs that test nothing (a pull request from a branch of this repository, tested by its push),
    # so that their check, skipped, never stands for the required one
    name: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) && 'success' || 'success (tested on push)' }}
    runs-on: ubuntu-26.04
    needs:
      - test
      - deploy
    if: >-
      always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) && (
        contains(join(needs.*.result, ','), 'failure')
        || !contains(join(needs.*.result, ','), 'cancelled')
      )
    steps:
      - name: Verify that there were no failures
        run: ${{ !contains(join(needs.*.result, ','), 'failure') }}
