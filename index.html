        <script>
            // The theme, set before the page is drawn so that it never flashes in the other one: the one the toggle
            // picked, or the system's (see src/theme.ts)
            (function () {
                var theme = null;
                try {
                    theme = localStorage.getItem('arg2p.theme');
                } catch (error) {}
                if (theme !== 'light' && theme !== 'dark') {
                    theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.dataset.theme = theme;
            })();
        </script>
